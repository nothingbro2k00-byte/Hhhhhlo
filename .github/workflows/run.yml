name: Windows RDP
on:
  workflow_dispatch:
concurrency:
  group: vps
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 385
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: choco install googlechrome 7zip -y --no-progress --ignore-checksums
    - name: Password
      shell: pwsh
      run: |
        $pw = ConvertTo-SecureString "Vps@uHe8R7w22" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $pw
    - name: RDP
      shell: pwsh
      run: |
        Set-ItemProperty 'HKLM:SystemCurrentControlSetControlTerminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Ngrok
      shell: pwsh
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -Force
        .
grok
grok.exe config add-authtoken "35gRf29MwAiVMPprS9lfNRkStA7_5bfvE2f5gs1ZWLuFKWPwV"
        Start-Process .
grok
grok.exe -ArgumentList "tcp","--region","ap","3389" -WindowStyle Hidden
        Start-Sleep 20
        $url = ""
        for ($i = 0; $i -lt 30; $i++) {
          try {
            $t = Invoke-RestMethod http://localhost:4040/api/tunnels
            if ($t.tunnels.Count -gt 0) { $url = $t.tunnels[0].public_url -replace 'tcp://','' ; break }
          } catch {}
          Start-Sleep 2
        }
        if ($url) { "$url|Vps@uHe8R7w22" | Out-File info.txt -NoNewline }
        else { "ERROR|Ngrok not found" | Out-File info.txt -NoNewline }
    - uses: actions/upload-artifact@v4
      with:
        name: result
        path: info.txt
    - name: Keep
      shell: pwsh
      run: Start-Sleep (360 * 60)